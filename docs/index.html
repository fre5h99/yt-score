<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유튜브 악보 추출</title>
<link rel="icon" href="data:,">
<style>
  body { font-family: -apple-system, sans-serif; margin: 0 auto; max-width: 1100px; padding: 16px; background: #f4f4f5; color: #222; }
  h1 { font-size: 20px; }
  section { background: #fff; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { padding: 8px 14px; cursor: pointer; }
  .hidden { display: none !important; }
  .err { color: #c00; white-space: pre-wrap; font-size: 13px; }
  .note { font-size: 13px; color: #555; margin: 6px 0 0; }
  .warn { font-size: 13px; background: #fef3c7; padding: 6px 8px; border-radius: 4px; margin-top: 6px; }
  .spinner { width: 16px; height: 16px; border: 3px solid #ccc; border-top-color: #333; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #stage { position: relative; user-select: none; margin: 8px 0; }
  #stage canvas { width: 100%; display: block; background: #000; }
  #box { position: absolute; left: 0; right: 0; background: rgba(0, 120, 255, .18); outline: 2px solid #08f; }
  .handle { position: absolute; left: 0; right: 0; height: 12px; cursor: ns-resize; background: rgba(0, 120, 255, .6); }
  .handle.top { top: -6px; } .handle.bottom { bottom: -6px; }
  #cards { display: grid; gap: 8px; }
  .card { display: flex; gap: 8px; align-items: center; border: 1px solid #ddd; border-radius: 6px; padding: 6px; cursor: pointer; background: #fff; }
  .card.off { opacity: .45; }
  .card.sel { border-color: #08f; box-shadow: 0 0 0 2px #08f inset; }
  .card img { width: 70%; background: #eee; min-height: 30px; }
  .badge { font-size: 11px; background: #fde68a; padding: 2px 6px; border-radius: 4px; }
  #editor { position: sticky; top: 0; z-index: 2; border: 2px solid #08f; }
  #editor img { width: 100%; background: #eee; min-height: 40px; }
  #editor label { display: flex; gap: 8px; align-items: center; font-size: 13px; margin: 4px 0; }
  #editor input[type=range] { flex: 1; }
</style>
</head>
<body>
<h1>유튜브 악보 → PDF</h1>

<section>
  <div class="row">
    <button id="shareBtn">탭 공유 시작</button>
    <button id="fileBtn">영상 파일 열기</button><input id="file" type="file" accept="video/*" class="hidden">
    <div id="spin" class="spinner hidden"></div>
    <span id="status"></span>
  </div>
  <p class="note">유튜브 탭을 공유하세요. 영상 화질 1080p, 극장 모드나 전체화면을 권장합니다. Chrome·Edge 데스크톱 기준입니다.</p>
  <div id="notice" class="warn hidden"></div>
  <div id="err" class="err"></div>
</section>

<section id="regionSec" class="hidden">
  <div>악보 영역: 파란 박스의 위·아래 경계를 드래그해 조정하세요. 영역을 바꾸면 다시 녹화(추출)해야 합니다.</div>
  <div id="stage"><canvas id="frame"></canvas><div id="box"><div class="handle top"></div><div class="handle bottom"></div></div></div>
  <label id="tRow" class="row">시점 <input id="t" type="range" min="0" step="1" style="flex:1"> <span id="tLabel"></span></label>
  <div class="row">
    <button id="detectBtn">자동 감지</button>
    <button id="recBtn">녹화 시작</button>
    <button id="stopBtn" class="hidden">정지</button>
    <label><input id="mask" type="checkbox" checked> 배경 제거</label>
    <button id="pdfBtn" disabled>PDF 저장</button>
  </div>
  <p id="recNote" class="note">녹화 시작 뒤 유튜브 영상을 처음부터 재생하고, 끝나면 정지를 누르세요.</p>
</section>

<section id="editor" class="hidden">
  <div class="row"><b id="edTitle"></b> <button id="edClose">닫기</button></div>
  <img id="edImg" alt="">
  <label>시작 <input id="edStart" type="range" step="1"> <span id="edStartL"></span></label>
  <label>끝 <input id="edEnd" type="range" step="1"> <span id="edEndL"></span></label>
  <label>분할 시점 <input id="edSplit" type="range" step="1"> <span id="edSplitL"></span></label>
  <div class="row"><button id="splitBtn">이 시점에서 분할</button><button id="mergeBtn">다음 줄과 병합</button></div>
</section>

<section id="cardSec" class="hidden"><div id="cards"></div></section>

<video id="vid" muted playsinline class="hidden"></video>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
